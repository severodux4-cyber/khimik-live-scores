name: Khimik Live Scores

on:
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Отправить тестовое сообщение в Telegram"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/5 6-15 * * 6,0"
    - cron: "0 16 * * 6,0"

concurrency:
  group: khimik-live-scores
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "388913310"
          COMPETITION_URL: "https://фхмо.рф/competitions/2026-2027/pervenstvo-moskovskoy-oblasti-po-khokkeyu-sredi-yunoshey-2026-2027/"
          TEST_NOTIFY: ${{ inputs.test_notify || 'false' }}
        run: python bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json state.backup.json users.json
          git diff --cached --quiet || git commit -m "Update bot state"
          git push
