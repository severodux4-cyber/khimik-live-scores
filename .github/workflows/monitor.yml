name: Khimik live scores

on:
  schedule:
    - cron: "*/5 * * * 6,0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: khimik-live-scores
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check scores
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "388913310"
          COMPETITION_URL: "https://фхмо.рф/competitions/2026-2027/pervenstvo-moskovskoy-oblasti-po-khokkeyu-sredi-yunoshey-2026-2027/"
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json

          if git diff --cached --quiet; then
            echo "State unchanged"
            exit 0
          fi

          git commit -m "Update score state"

          for i in 1 2 3 4 5; do
            echo "Push attempt $i"

            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "State pushed successfully"
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            echo "Push failed, retrying..."
            sleep 5
          done

          echo "Unable to push state after 5 attempts"
          exit 1
